
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | INIKORE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #100d0e;
            color: #efe7e0;
            font-family: Arial, sans-serif;
        }

        .panel {
            width: 100%;
            max-width: 430px;
            padding: 42px 32px;
            border: 1px solid rgba(239, 231, 224, .16);
            border-radius: 18px;
            background: linear-gradient(145deg, #24191c, #151112);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .4);
        }

        .brand {
            color: #c7a58e;
            letter-spacing: 5px;
            font-size: 13px;
            margin-bottom: 34px;
        }

        h1 {
            font-size: 30px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .description {
            color: #b6a6a0;
            line-height: 1.6;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 13px;
            margin: 18px 0 9px;
            color: #d8c8b8;
        }

        .password-wrap {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px;
            padding-right: 65px;
            border-radius: 9px;
            border: 1px solid #59434a;
            background: #171214;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #c7a58e;
        }

        .toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            padding: 5px;
            background: transparent;
            color: #c7a58e;
            font-size: 12px;
        }

        .toggle:hover {
            background: transparent;
            color: #fff;
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: 0;
            border-radius: 9px;
            background: #591624;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .submit-button:hover:not(:disabled) {
            background: #732231;
        }

        .submit-button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.6;
            color: #d8c8b8;
        }

        #message.error {
            color: #ff9999;
        }

        #message.success {
            color: #a9d9ad;
        }

        a {
            display: inline-block;
            margin-top: 22px;
            color: #c7a58e;
            text-decoration: none;
            font-size: 13px;
        }

        a:hover {
            color: #fff;
        }
    </style>
</head>

<body>

    <main class="panel">

        <div class="brand">INIKORE</div>

        <section>

            <h1>Reset your password.</h1>

            <p class="description">
                Create a new password for your INIKORE admin account.
            </p>

            <form id="resetForm">

                <label for="password">New password</label>

                <div class="password-wrap">
                    <input
                        type="password"
                        id="password"
                        minlength="8"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        required
                        disabled
                    >

                    <button
                        type="button"
                        class="toggle"
                        data-target="password"
                    >Show</button>
                </div>

                <label for="confirmPassword">Confirm password</label>

                <div class="password-wrap">
                    <input
                        type="password"
                        id="confirmPassword"
                        minlength="8"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        required
                        disabled
                    >

                    <button
                        type="button"
                        class="toggle"
                        data-target="confirmPassword"
                    >Show</button>
                </div>

                <button
                    type="submit"
                    class="submit-button"
                    id="saveButton"
                    disabled
                >
                    Verifying link...
                </button>

            </form>

            <p id="message" role="status" aria-live="polite">
                Securing your recovery link...
            </p>

        </section>

        <a href="dashboard.html">Back to Admin Login</a>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <script>

        const supabase = window.inikoreSupabase;

        const resetForm = document.getElementById("resetForm");
        const passwordInput = document.getElementById("password");
        const confirmInput = document.getElementById("confirmPassword");
        const saveButton = document.getElementById("saveButton");
        const message = document.getElementById("message");

        let recoveryVerified = false;
        let passwordUpdated = false;

        function showMessage(text, type = "") {
            message.textContent = text;
            message.className = type;
        }

        function enableForm() {
            if (recoveryVerified) return;

            recoveryVerified = true;

            passwordInput.disabled = false;
            confirmInput.disabled = false;

            saveButton.disabled = false;
            saveButton.textContent = "Update Password";

            showMessage("Your recovery link is verified. Create your new password.");
        }

        function disableForm(text) {
            recoveryVerified = false;

            passwordInput.disabled = true;
            confirmInput.disabled = true;
            saveButton.disabled = true;

            saveButton.textContent = "Link unavailable";

            showMessage(text, "error");
        }

        // Show / hide password
        document.querySelectorAll(".toggle").forEach(button => {
            button.addEventListener("click", () => {

                const input = document.getElementById(
                    button.dataset.target
                );

                const isPassword = input.type === "password";

                input.type = isPassword ? "text" : "password";
                button.textContent = isPassword ? "Hide" : "Show";

            });
        });

        // Check recovery URL
        const urlParams = new URLSearchParams(
            window.location.search
        );

        const hashParams = new URLSearchParams(
            window.location.hash.substring(1)
        );

        const recoveryError =
            urlParams.get("error_description") ||
            hashParams.get("error_description");

        const hasRecoveryMarker =
            urlParams.has("code") ||
            urlParams.has("token_hash") ||
            urlParams.get("type") === "recovery" ||
            hashParams.get("type") === "recovery" ||
            hashParams.has("access_token");

        async function initializeRecovery() {

            if (!supabase) {
                disableForm(
                    "Unable to connect to INIKORE. Please refresh the page."
                );
                return;
            }

            if (recoveryError) {
                disableForm(
                    "Your recovery link is invalid or expired. Please request a fresh link."
                );
                return;
            }

            if (!hasRecoveryMarker) {
                disableForm(
                    "Please open the password recovery link from your latest INIKORE email."
                );
                return;
            }

            // Listen for Supabase recovery verification.
            supabase.auth.onAuthStateChange((event, session) => {

                if (event === "PASSWORD_RECOVERY" && session) {
                    enableForm();
                }

            });

            // Handle token_hash links if the email template uses them.
            const tokenHash = urlParams.get("token_hash");

            if (tokenHash) {

                const { error } = await supabase.auth.verifyOtp({
                    token_hash: tokenHash,
                    type: "recovery"
                });

                if (error) {
                    disableForm(
                        "Your recovery link is invalid or expired. Please request a fresh link."
                    );
                }

                return;
            }

            // Supabase processes standard recovery links automatically.
            // Wait for its PASSWORD_RECOVERY event.
            setTimeout(() => {

                if (!recoveryVerified) {
                    disableForm(
                        "We couldn't verify this recovery link. Please request a fresh password reset email and open its latest link."
                    );
                }

            }, 15000);

        }

        initializeRecovery();

        // Update password
        resetForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            if (!recoveryVerified || passwordUpdated) return;

            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;

            if (password.length < 8) {
                showMessage(
                    "Password must contain at least 8 characters.",
                    "error"
                );
                return;
            }

            if (password !== confirmPassword) {
                showMessage(
                    "Passwords do not match.",
                    "error"
                );
                return;
            }

            saveButton.disabled = true;
            saveButton.textContent = "Updating...";

            showMessage("");

            try {

                const { error } = await supabase.auth.updateUser({
                    password: password
                });

                if (error) {
                    throw error;
                }

                passwordUpdated = true;
                recoveryVerified = false;

                resetForm.reset();

                showMessage(
                    "Password updated successfully! Redirecting to login...",
                    "success"
                );

                setTimeout(async () => {

                    await supabase.auth.signOut();

                    window.location.href = "dashboard.html";

                }, 2000);

            } catch (error) {

                showMessage(
                    error.message || "Unable to update your password.",
                    "error"
                );

                saveButton.disabled = false;
                saveButton.textContent = "Update Password";

            }

        });

    </script>

</body>
</html>
