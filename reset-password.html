
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | INIKORE</title>
    <meta name="theme-color" content="#100d0e">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #100d0e;
            --glass: rgba(239, 231, 224, 0.055);
            --border: rgba(239, 231, 224, 0.14);
            --gold: #c7a58e;
            --text: #efe7e0;
            --muted: #ad9b94;
            --burgundy: #591624;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 25px;
            overflow-x: hidden;
            position: relative;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(89,22,36,.32), transparent 45%),
                radial-gradient(ellipse at 85% 85%, rgba(199,165,142,.12), transparent 40%),
                linear-gradient(135deg, #100d0e, #1b1115 55%, #100d0e);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .ambient {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .22;
            pointer-events: none;
            z-index: 0;
        }

        .ambient.one {
            background: #732231;
            top: -150px;
            left: -120px;
        }

        .ambient.two {
            background: #9b705a;
            bottom: -180px;
            right: -120px;
        }

        .panel {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
            padding: 48px 38px;
            background: rgba(35,25,28,.66);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow:
                0 30px 90px rgba(0,0,0,.48),
                inset 0 1px 0 rgba(255,255,255,.07);
            animation: appear .8s ease both;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(22px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 48px;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(199,165,142,.45);
            border-radius: 10px;
            color: var(--gold);
            font-size: 17px;
            font-weight: 600;
        }

        .brand-name {
            color: var(--text);
            font-size: 13px;
            letter-spacing: 5px;
            font-weight: 600;
        }

        .eyebrow {
            color: var(--gold);
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(27px, 5vw, 34px);
            font-weight: 500;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-bottom: 13px;
        }

        .description {
            color: var(--muted);
            line-height: 1.8;
            font-size: 13px;
            margin-bottom: 32px;
        }

        label {
            display: block;
            color: #d8c8b8;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .field {
            margin-bottom: 21px;
        }

        .password-wrap {
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px 65px 15px 16px;
            border: 1px solid rgba(199,165,142,.2);
            border-radius: 12px;
            background: rgba(12,9,10,.48);
            color: white;
            outline: none;
            font-size: 14px;
            transition: .3s ease;
        }

        input::placeholder {
            color: rgba(239,231,224,.32);
        }

        input:focus {
            border-color: var(--gold);
            background: rgba(12,9,10,.7);
            box-shadow: 0 0 0 3px rgba(199,165,142,.08);
        }

        input:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .toggle {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            padding: 5px;
            background: transparent;
            border: none;
            color: var(--gold);
            font-size: 11px;
            cursor: pointer;
        }

        .toggle:hover {
            color: white;
        }

        .submit-button {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            border: 1px solid rgba(199,165,142,.25);
            border-radius: 12px;
            background: linear-gradient(110deg, #591624, #732231);
            color: white;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: .3s ease;
        }

        .submit-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(89,22,36,.4);
        }

        .submit-button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        #message {
            min-height: 38px;
            margin-top: 20px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.7;
            text-align: center;
        }

        #message.error {
            color: #ff9999;
        }

        #message.success {
            color: #a9d9ad;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            padding-top: 24px;
            border-top: 1px solid rgba(239,231,224,.09);
        }

        .footer a {
            color: var(--gold);
            font-size: 12px;
            text-decoration: none;
            transition: .3s;
        }

        .footer a:hover {
            color: white;
        }

        .copyright {
            position: fixed;
            bottom: 18px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(239,231,224,.28);
            font-size: 10px;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            body {
                padding: 18px;
            }

            .panel {
                padding: 36px 25px;
                border-radius: 20px;
            }

            .brand {
                margin-bottom: 38px;
            }

            .copyright {
                position: relative;
                bottom: auto;
                margin-top: 25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="ambient one"></div>
    <div class="ambient two"></div>

    <main class="panel">

        <div class="brand">
            <div class="brand-mark">I</div>
            <div class="brand-name">INIKORE</div>
        </div>

        <section>
            <p class="eyebrow">Account security</p>

            <h1>Reset your password.</h1>

            <p class="description">
                Create a new password for your INIKORE admin account.
                Your account security matters to us.
            </p>

            <form id="resetForm">

                <div class="field">
                    <label for="password">New password</label>

                    <div class="password-wrap">
                        <input
                            type="password"
                            id="password"
                            minlength="8"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            required
                            disabled
                        >

                        <button
                            type="button"
                            class="toggle"
                            data-target="password"
                        >Show</button>
                    </div>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirm password</label>

                    <div class="password-wrap">
                        <input
                            type="password"
                            id="confirmPassword"
                            minlength="8"
                            placeholder="Confirm new password"
                            autocomplete="new-password"
                            required
                            disabled
                        >

                        <button
                            type="button"
                            class="toggle"
                            data-target="confirmPassword"
                        >Show</button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="submit-button"
                    id="saveButton"
                    disabled
                >
                    VERIFYING LINK...
                </button>

            </form>

            <p id="message" role="status" aria-live="polite">
                Securing your recovery link...
            </p>
        </section>

        <div class="footer">
            <a href="dashboard.html">← Back to Admin Login</a>
        </div>

    </main>

    <div class="copyright">
        © INIKORE — CREATIVE PORTFOLIO PLATFORM
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <script>
        (() => {
            "use strict";

            const supabaseClient = window.inikoreSupabase;

            const resetForm = document.getElementById("resetForm");
            const passwordInput = document.getElementById("password");
            const confirmInput = document.getElementById("confirmPassword");
            const saveButton = document.getElementById("saveButton");
            const message = document.getElementById("message");

            let recoveryVerified = false;
            let passwordUpdated = false;
            let verificationFinished = false;

            function showMessage(text, type = "") {
                message.textContent = text;
                message.className = type;
            }

            function enableForm() {
                if (recoveryVerified || passwordUpdated) return;

                recoveryVerified = true;
                verificationFinished = true;

                passwordInput.disabled = false;
                confirmInput.disabled = false;

                saveButton.disabled = false;
                saveButton.textContent = "UPDATE PASSWORD";

                showMessage(
                    "Your recovery link is verified. Create your new password."
                );
            }

            function disableForm(text) {
                recoveryVerified = false;
                verificationFinished = true;

                passwordInput.disabled = true;
                confirmInput.disabled = true;
                saveButton.disabled = true;
                saveButton.textContent = "LINK UNAVAILABLE";

                showMessage(text, "error");
            }

            // Show / hide passwords
            document.querySelectorAll(".toggle").forEach(button => {
                button.addEventListener("click", () => {
                    const input = document.getElementById(
                        button.dataset.target
                    );

                    const isPassword = input.type === "password";

                    input.type = isPassword ? "text" : "password";
                    button.textContent = isPassword ? "Hide" : "Show";
                });
            });

            // Capture URL parameters before Supabase processes the URL.
            const urlParams = new URLSearchParams(
                window.location.search
            );

            const hashParams = new URLSearchParams(
                window.location.hash.substring(1)
            );

            const recoveryError =
                urlParams.get("error_description") ||
                hashParams.get("error_description") ||
                urlParams.get("error") ||
                hashParams.get("error");

            const tokenHash = urlParams.get("token_hash");

            const hasRecoveryMarker =
                urlParams.has("code") ||
                urlParams.has("token_hash") ||
                urlParams.get("type") === "recovery" ||
                hashParams.get("type") === "recovery" ||
                (
                    hashParams.has("access_token") &&
                    hashParams.get("type") === "recovery"
                );

            // Listen before checking the session.
            if (supabaseClient) {
                supabaseClient.auth.onAuthStateChange((event, session) => {
                    if (event === "PASSWORD_RECOVERY" && session) {
                        enableForm();
                    }
                });
            }

            async function initializeRecovery() {
                if (!supabaseClient) {
                    disableForm(
                        "Unable to connect to INIKORE. Please refresh the page."
                    );
                    return;
                }

                if (recoveryError) {
                    disableForm(
                        "Your recovery link is invalid or expired. Please request a fresh link."
                    );
                    return;
                }

                if (!hasRecoveryMarker) {
                    disableForm(
                        "No recovery token was found. Please open the latest password reset link from your email."
                    );
                    return;
                }

                try {
                    // Handle token_hash verification.
                    if (tokenHash) {
                        const { data, error } =
                            await supabaseClient.auth.verifyOtp({
                                token_hash: tokenHash,
                                type: "recovery"
                            });

                        if (error) throw error;

                        if (data.session) {
                            enableForm();
                            return;
                        }
                    }

                    // Supabase JS automatically processes supported
                    // PKCE and access-token recovery URLs.
                    // Wait for initialization and check the resulting session.
                    const { data, error } =
                        await supabaseClient.auth.getSession();

                    if (error) throw error;

                    if (data.session) {
                        enableForm();
                        return;
                    }

                    // Allow the recovery event time to arrive.
                    setTimeout(() => {
                        if (!recoveryVerified) {
                            disableForm(
                                "We couldn't verify this recovery link. Please request a fresh password reset email and open its latest link."
                            );
                        }
                    }, 12000);

                } catch (error) {
                    console.error("Recovery verification error:", error);

                    disableForm(
                        error.message ||
                        "Your recovery link could not be verified. Please request a fresh link."
                    );
                }
            }

            initializeRecovery();

            // Update password.
            resetForm.addEventListener("submit", async event => {
                event.preventDefault();

                if (!recoveryVerified || passwordUpdated) return;

                const password = passwordInput.value;
                const confirmPassword = confirmInput.value;

                if (password.length < 8) {
                    showMessage(
                        "Password must contain at least 8 characters.",
                        "error"
                    );
                    return;
                }

                if (password !== confirmPassword) {
                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );
                    return;
                }

                saveButton.disabled = true;
                saveButton.textContent = "UPDATING...";
                showMessage("");

                try {
                    const { error } =
                        await supabaseClient.auth.updateUser({
                            password: password
                        });

                    if (error) throw error;

                    passwordUpdated = true;
                    recoveryVerified = false;

                    resetForm.reset();

                    passwordInput.disabled = true;
                    confirmInput.disabled = true;

                    saveButton.disabled = true;
                    saveButton.textContent = "PASSWORD UPDATED";

                    showMessage(
                        "Password updated successfully! Redirecting to login...",
                        "success"
                    );

                    setTimeout(async () => {
                        await supabaseClient.auth.signOut();
                        window.location.href = "dashboard.html";
                    }, 2000);

                } catch (error) {
                    console.error("Password update error:", error);

                    showMessage(
                        error.message || "Unable to update your password.",
                        "error"
                    );

                    saveButton.disabled = false;
                    saveButton.textContent = "UPDATE PASSWORD";
                }
            });

        })();
    </script>

</body>
</html>
