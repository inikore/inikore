
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | INIKORE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #100d0e;
            color: #efe7e0;
            font-family: Arial, sans-serif;
        }

        .panel {
            width: 100%;
            max-width: 430px;
            padding: 42px 32px;
            border: 1px solid rgba(239, 231, 224, .16);
            border-radius: 18px;
            background: linear-gradient(145deg, #24191c, #151112);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .4);
        }

        .brand {
            color: #c7a58e;
            letter-spacing: 5px;
            font-size: 13px;
            margin-bottom: 34px;
        }

        h1 {
            font-size: 30px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .description {
            color: #b6a6a0;
            line-height: 1.6;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 13px;
            margin: 18px 0 9px;
            color: #d8c8b8;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 9px;
            border: 1px solid #59434a;
            background: #171214;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #c7a58e;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: 0;
            border-radius: 9px;
            background: #591624;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #732231;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.6;
            color: #d8c8b8;
        }

        a {
            display: inline-block;
            margin-top: 22px;
            color: #c7a58e;
            text-decoration: none;
            font-size: 13px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <main class="panel">
        <div class="brand">INIKORE</div>

        <section id="resetSection" class="hidden">
            <h1>Create new password.</h1>
            <p class="description">
                Choose a new password for your INIKORE admin account.
            </p>

            <form id="resetForm">
                <label for="password">New password</label>
                <input
                    type="password"
                    id="password"
                    minlength="8"
                    placeholder="Enter new password"
                    autocomplete="new-password"
                    required
                >

                <label for="confirmPassword">Confirm password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    minlength="8"
                    placeholder="Confirm new password"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" id="saveButton">
                    Update Password
                </button>
            </form>

            <p id="message" role="status"></p>
        </section>

        <section id="loadingSection">
            <h1>Verifying your link.</h1>
            <p class="description" id="loadingMessage">
                Please wait while we verify your password recovery link.
            </p>
        </section>

        <a href="dashboard.html">Back to Admin Login</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <script>
        const supabase = window.inikoreSupabase;

        const resetSection = document.getElementById("resetSection");
        const loadingSection = document.getElementById("loadingSection");
        const loadingMessage = document.getElementById("loadingMessage");
        const resetForm = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const saveButton = document.getElementById("saveButton");

        let recoverySessionReady = false;

        function showResetForm() {
            recoverySessionReady = true;
            loadingSection.classList.add("hidden");
            resetSection.classList.remove("hidden");
        }

        function showError(errorText) {
            loadingSection.classList.remove("hidden");
            resetSection.classList.add("hidden");
            loadingMessage.textContent = errorText;
        }

        supabase.auth.onAuthStateChange(async (event, session) => {
            if (event === "PASSWORD_RECOVERY" && session) {
                showResetForm();
            }
        });

        async function checkRecoverySession() {
            const { data, error } = await supabase.auth.getSession();

            if (error) {
                showError(error.message);
                return;
            }

            if (data.session) {
                showResetForm();
            } else {
                showError(
                    "This recovery link is invalid or expired. Request a new password recovery email."
                );
            }
        }

        checkRecoverySession();

        resetForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!recoverySessionReady) return;

            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password.length < 8) {
                message.textContent =
                    "Your password must contain at least 8 characters.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            saveButton.disabled = true;
            saveButton.textContent = "Updating...";
            message.textContent = "";

            const { error } = await supabase.auth.updateUser({
                password: password
            });

            if (error) {
                message.textContent = error.message;
                saveButton.disabled = false;
                saveButton.textContent = "Update Password";
                return;
            }

            message.textContent =
                "Password updated successfully! Redirecting to admin login...";

            resetForm.reset();

            setTimeout(async () => {
                await supabase.auth.signOut();
                window.location.href = "dashboard.html";
            }, 2000);
        });
    </script>
</body>
</html>
